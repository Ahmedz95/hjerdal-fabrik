name: Fabrik
on:
  push:
    branches: [main]
  pull_request:
jobs:
  exempelkund:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          # 3.9 är den som följer med macOS, så Designer provkörs med den.
          python-version: |
            3.9
            3.12
      - name: Kundfilens schema är uppdaterat
        working-directory: starter
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run schema
          git diff --exit-code cms.manifest.json || { echo "::error::cms.manifest.json är inte uppdaterad. Kör npm run schema i starter/ och checka in filen."; exit 1; }
      - name: Kvalitetsgrinden för alla aktiva kunder
        run: python3 fabrik.py kvalitet
      - name: Egen design, brief och designspec
        run: python3 quality/prov_fabrik.py
      - name: HJERDAL Designer och MCP
        run: python3.9 designer/prov.py
      - name: Bygg en variant i varje stil
        run: python3 fabrik.py varianter bistro-nordvik
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabrik
          path: |
            ut/*/kvalitet
            ut/bistro-nordvik/dist
            ut/bistro-nordvik-varianter
            lhci
